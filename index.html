<!DOCTYPE html>
<html>
    <head>
        <title>Veil Nova</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="banner">
            <div class="navbar">
                <img src="logo.png" class="logo" alt="Veil Nova Logo">
                <ul>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="collections.html">Collections</a></li>
                    <li><a href="of.html">Offers & Deals</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </div>
            <div class="content">
                <h1>Welcome to Veil Nova</h1>
                <p class="welcome-text">Where tradition meets modern style. Discover unique collections crafted to elevate your fashion game. Explore the best of elegance and trend with us!</p>
                <br>
                <button class="btn" id="signupBtn">Sign Up</button>
                <button class="btn" id="signInBtn">Sign In</button>
            </div>
        </div>

        <div id="popup" class="popup">
            <div class="popup-content">
                <span class="close" id="closePopup">&times;</span>
                <h2>Sign Up</h2>
                <form method="post" action="register.php" id="signupForm">
                    <input type="text" name="username" placeholder="Username" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <input type="text" name="phone" placeholder="Phone Number" required>
                    <input type="email" name="email" placeholder="Email Address" required>
                    <button type="submit" class="btn">Submit</button>
                </form> 
            </div>
        </div>        

        <div id="signInPopup" class="popup">
            <div class="popup-content">
                <span class="close" id="closeSignInPopup">&times;</span>
                <h2>Sign In</h2>
                <form method="post" action="login.php" id="loginForm">
                    <input type="text" name="username" placeholder="Username" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <button type="submit" class="btn">Sign In</button>
                </form>
            </div>
        </div>       

        <script src="new.js"></script>
    </body>
</html>
